name: CI

# Mandatory merge gate. Mirrors `make ci` locally.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Build · Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Format check
        run: forge fmt --check
      - name: Lint shipping code (zero findings policy)
        run: |
          forge lint src/ script/ 2>&1 | tee lint.log
          ! grep -qE '^(warning|note)\[' lint.log
      - name: Lint tests (advisory)
        run: forge lint test/ || true
      - name: Build
        run: forge build --sizes

  test:
    name: Unit · E2E · Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Run tests
        run: forge test --no-match-path "test/invariant/*" -vv

  invariants:
    name: Invariants (fail_on_revert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Run invariant suite
        env:
          FOUNDRY_INVARIANT_FAIL_ON_REVERT: "true"
          FOUNDRY_INVARIANT_RUNS: "256"
          FOUNDRY_INVARIANT_DEPTH: "64"
        run: forge test --match-path "test/invariant/*" -vv

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Coverage (escrow + distributor must stay fully covered)
        run: |
          forge coverage --no-match-path "test/invariant/*" --report summary --report lcov \
            --no-match-coverage "(script|test|mocks)" | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: .
          fail-on: high
          sarif: results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.slither.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
